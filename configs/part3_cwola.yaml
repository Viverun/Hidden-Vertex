# Part 3d: CWoLa-style bump hunt (weak supervision, no labels in training).
# PROTOCOL FIXED on 2026-11-14, before any CWoLa score was computed on the test set.
# Do not change any value here after a test AUC has been seen. Test AUC selects nothing.

data:
  features_file: dataset/raw/events_anomalydetection_v2.features.h5
  # Frozen test set (same as Parts 1-3): never used for training or reference.
  test_bg_rows: [40000, 45000]          # half-open
  test_sig_rows: [1000000, 1005000]
  # Unlabeled pool: background rows not in the test set, plus injected signal.
  pool_bg_rows: [45000, 1000000]
  inject_sig_rows: [1005000, 1100000]   # signal rows never in the test set
  features: [mj1, mj2, tau21_j1, tau21_j2]   # "jet4"; mjj is NOT a classifier input

injection:
  # Signal fraction S/B in the whole pool. n_sig = round(fraction * n_pool_bg).
  fractions: [0.0, 0.0005, 0.001, 0.002, 0.005, 0.01]
  seeds: [0, 1, 2]                      # which signal events are injected + all splits
  primary_fraction: 0.001               # the LHCO benchmark level; the gate is judged here

split:
  train_fraction: 0.7                   # trains the classifiers
  # The other 0.3 is the reference sample: it only supplies the per-window score
  # distribution used to turn a classifier output into a quantile.

windows:
  # Two grids of signal regions in mjj (TeV), offset by half a window. Round-number
  # edges, not centred on the known signal mass (3.5 TeV). Outer bins are open-ended.
  width: 0.4
  sideband: 0.2                         # on each side of the signal region
  grid_a_edges: [2.0, 2.4, 2.8, 3.2, 3.6, 4.0, 4.4, 4.8, 5.2]
  grid_b_edges: [2.2, 2.6, 3.0, 3.4, 3.8, 4.2, 4.6, 5.0, 5.4]
  # Events below the first edge use the first window; events above the last edge
  # use the last window. An open-ended outer window has one sideband of width 0.4
  # on its inner side... see src for the exact rule; it must be label-free.
  min_events_per_class: 2000            # if SR or SB has fewer training events,
                                        # merge the window with its inner neighbour

classifier:
  kind: HistGradientBoostingClassifier
  max_iter: 200
  learning_rate: 0.1
  max_leaf_nodes: 31
  early_stopping: true
  validation_fraction: 0.5
  n_iter_no_change: 10
  class_weight: balanced
  ensemble: 10                          # different split seeds; mean of P(SR | x)

score:
  # For each grid: the event's window is the one whose signal region holds its mjj.
  # quantile = fraction of reference-sample SR events of that window with a lower
  # ensemble output. Final score = mean of the two grids' quantiles.
  # Higher = more anomalous.
  kind: mean_window_quantile

secondary:
  # Reported for reference only, clearly labelled as using the known signal mass.
  oracle_window: {sr: [3.3, 3.7], sb: [[3.1, 3.3], [3.7, 3.9]]}

evaluation:
  gate_bar_auc: 0.811                   # mean pT per particle, as in Parts 1-3
  min_within_bin_auc: 0.6
  bootstrap: 1000

predictions:                            # fixed in advance; report pass/fail for each
  - "fraction 0.0: seed-mean AUC inside [0.47, 0.53] (no signal, no detection)"
  - "seed-mean AUC does not decrease as the fraction increases (tolerance 0.01)"
  - "fraction 0.001 (primary): gate passed (CI lower bound > 0.811 and min within-bin AUC >= 0.6)"
  - "fraction >= 0.005: seed-mean AUC > 0.90"

output:
  dir: results/part3/cwola
  report: results/part3/cwola.md
  json: results/part3/cwola.json
